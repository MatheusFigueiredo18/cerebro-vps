# Pilha do WhatsApp: Evolution API (com Postgres e Redis) e n8n.
# Variáveis vêm de /opt/core-os/.env (ligado como .env desta pasta). Portas só no loopback.
name: core-os

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coreos
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreos -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  evolution:
    image: ${EVOLUTION_IMAGE:?falta EVOLUTION_IMAGE no .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: ${EVO_KEY:?falta EVO_KEY no .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://coreos:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: cerebro_vps
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Cerebro VPS
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
    volumes:
      - evolution:/evolution/instances

  n8n:
    image: ${N8N_IMAGE:?falta N8N_IMAGE no .env}
    restart: unless-stopped
    ports: ["127.0.0.1:5679:5678"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY no .env}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${N8N_PUBLIC_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      CORE_OS_HOOK_TOKEN: ${CORE_OS_HOOK_TOKEN:?falta CORE_OS_HOOK_TOKEN no .env}
      CORE_OS_PONTE: http://host.docker.internal:${CORE_OS_PORT:-3000}/api/ponte/whatsapp
    volumes:
      - n8n:/home/node/.n8n
      - ./fluxos:/fluxos:ro

volumes:
  postgres:
  redis:
  evolution:
  n8n:
